spring.application.name=helpdesk-api

# Local runs use the dev profile unless one is set explicitly (the Docker image sets prod)
spring.profiles.default=dev

# Database: values come from the environment, with no defaults
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# JWT
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration=${JWT_EXPIRATION:PT1H}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Errors
spring.web.error.include-stacktrace=never

server.port=${PORT:8080}